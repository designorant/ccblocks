name: Publish
run-name: Publish

on:
  workflow_run:
    workflows: ["Test"]
    branches: [master]
    types:
      - completed

permissions:
  contents: read

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-latest
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push'
    outputs:
      version: ${{ steps.get_version.outputs.version }}
      tag_exists: ${{ steps.check_tag.outputs.exists }}
      tap_behind: ${{ steps.check_tap.outputs.behind }}

    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 0
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false

      - name: Get version from VERSION file
        id: get_version
        run: |
          VERSION=$(tr -d '\n\r' < VERSION)
          VERSION_REGEX='^[0-9]+[.][0-9]+[.][0-9]+(-[0-9A-Za-z][0-9A-Za-z.-]*)?([+][0-9A-Za-z][0-9A-Za-z.-]*)?$'

          if [[ ! "$VERSION" =~ $VERSION_REGEX ]]; then
            echo "Version must match SemVer, for example 1.2.3 or 1.2.3-beta.1" >&2
            exit 1
          fi

          printf 'version=%s\n' "$VERSION" >> "$GITHUB_OUTPUT"
          echo "Version: $VERSION"

      # Release whenever VERSION is ahead of the tags: idempotent, and
      # self-healing when the bump push itself failed CI.
      - name: Check if tag already exists
        id: check_tag
        env:
          VERSION: ${{ steps.get_version.outputs.version }}
        run: |
          if git rev-parse "v${VERSION}" >/dev/null 2>&1; then
            echo "exists=true" >> $GITHUB_OUTPUT
            echo "Tag v${VERSION} already exists"
          else
            echo "exists=false" >> $GITHUB_OUTPUT
            echo "Tag v${VERSION} does not exist"
          fi

      # Reconcile the Homebrew tap independently of tag creation, so a
      # failed bump self-heals on the next run even though the tag exists.
      - name: Check if the Homebrew tap is behind
        id: check_tap
        env:
          VERSION: ${{ steps.get_version.outputs.version }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAP_VERSION=$(gh api repos/designorant/homebrew-tap/contents/Formula/ccblocks.rb \
            --jq '.content' 2>/dev/null | base64 -d 2>/dev/null \
            | sed -n 's|.*/archive/refs/tags/v\([0-9][0-9A-Za-z.-]*\)\.tar\.gz.*|\1|p' | head -1)
          echo "Tap formula version: ${TAP_VERSION:-unknown}"

          if [ "$TAP_VERSION" != "$VERSION" ]; then
            echo "behind=true" >> "$GITHUB_OUTPUT"
            echo "Tap is behind (tap=${TAP_VERSION:-unknown}, target=$VERSION)"
          else
            echo "behind=false" >> "$GITHUB_OUTPUT"
            echo "Tap is up to date at $VERSION"
          fi

  release:
    name: Publish
    needs: validate
    # Tag/release creation is gated per-step on a missing tag; the tap bump
    # is gated on the tap being behind. Run the job if either is needed.
    if: needs.validate.outputs.tag_exists == 'false' || needs.validate.outputs.tap_behind == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 0
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Generate changelog
        if: needs.validate.outputs.tag_exists == 'false'
        id: changelog
        env:
          VERSION: ${{ needs.validate.outputs.version }}
          REPOSITORY: ${{ github.repository }}
        run: |
          # Get commits since last tag (or all if no previous tag)
          LAST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "")

          if [ -n "$LAST_TAG" ]; then
            COMMITS=$(git log "${LAST_TAG}..HEAD" --pretty=format:"- %s (%h)" --no-merges)
            echo "## Changes since ${LAST_TAG}" > changelog.md
          else
            COMMITS=$(git log --pretty=format:"- %s (%h)" --no-merges)
            echo "## Initial Release" > changelog.md
          fi

          echo "" >> changelog.md
          echo "$COMMITS" >> changelog.md
          echo "" >> changelog.md
          echo "**Full Changelog**: https://github.com/${REPOSITORY}/commits/v${VERSION}" >> changelog.md

          cat changelog.md

      - name: Create and push tag
        if: needs.validate.outputs.tag_exists == 'false'
        env:
          VERSION: ${{ needs.validate.outputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Create tag only if it doesn't exist
          if ! git rev-parse "v${VERSION}" >/dev/null 2>&1; then
            git tag -a "v${VERSION}" -m "Release v${VERSION}"
            git push origin "v${VERSION}"
            echo "Tag v${VERSION} created and pushed"
          else
            echo "Tag v${VERSION} already exists, skipping"
          fi

      - name: Create GitHub release
        if: needs.validate.outputs.tag_exists == 'false'
        uses: softprops/action-gh-release@b4309332981a82ec1c5618f44dd2e27cc8bfbfda # v3.0.0
        with:
          tag_name: v${{ needs.validate.outputs.version }}
          name: v${{ needs.validate.outputs.version }}
          body_path: changelog.md
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Homebrew 6 refuses to evaluate formulae from untrusted third-party
      # taps. Trust persists in ~/.homebrew/trust.json for the rest of the
      # job, so the bump action's internal brew calls inherit it.
      - name: Trust the Homebrew tap
        if: needs.validate.outputs.tap_behind == 'true'
        run: |
          brew tap designorant/tap
          brew trust designorant/tap 2>/dev/null || true

      - name: Publish to Homebrew tap
        if: needs.validate.outputs.tap_behind == 'true'
        uses: dawidd6/action-homebrew-bump-formula@1446dca236b0440c6f02723a3f14f13be2c04ab0 # v7
        with:
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          formula: ccblocks
          tap: designorant/homebrew-tap
          tag: v${{ needs.validate.outputs.version }}

      - name: Auto-merge Homebrew tap PR
        if: needs.validate.outputs.tap_behind == 'true'
        env:
          GH_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          VERSION: ${{ needs.validate.outputs.version }}
        run: |
          # Wait for PR to be created
          sleep 5

          # Find and merge the bump PR
          PR_NUMBER=$(gh pr list \
            --repo designorant/homebrew-tap \
            --head "bump-ccblocks-${VERSION}" \
            --json number \
            --jq '.[0].number // empty')

          if [ -n "$PR_NUMBER" ]; then
            gh pr merge "$PR_NUMBER" \
              --repo designorant/homebrew-tap \
              --squash \
              --subject "chore: bump ccblocks to ${VERSION}" \
              --body ""
            echo "✓ Merged PR #$PR_NUMBER"
          else
            echo "⚠ No PR found for bump-ccblocks-${VERSION}"
            exit 1
          fi
